services:
  - type: web
    name: arix-screen-sharing
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ARIX_STUN_URLS
        value: stun:stun.l.google.com:19302
