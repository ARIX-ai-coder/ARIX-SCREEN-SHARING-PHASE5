name: Build ARIX Screen Sharing APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Phase 5 source
        run: |
          unzip -oq ARIX_SCREEN_SHARING_PHASE5.zip
          test -f ARIX_SCREEN_SHARING/android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        working-directory: ARIX_SCREEN_SHARING/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIX-SCREEN-SHARING-PHASE5-debug-apk
          path: ARIX_SCREEN_SHARING/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
